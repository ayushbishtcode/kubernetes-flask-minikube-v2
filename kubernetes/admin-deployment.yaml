apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-deployment
  namespace: flask-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: admin

  template:
    metadata:
      labels:
        app: admin

    spec:
      containers:
        - name: admin
          image: admin-app:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 5007
