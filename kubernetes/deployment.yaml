apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment
  namespace: flask-dev

spec:
  replicas: 3

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      containers:
        - name: flask
          image: kubernetes-flask:v4
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5006

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          envFrom:
            - configMapRef:
                name: flask-config
            - secretRef:
                name: flask-secret
