apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment
  namespace: flask-dev

spec:
  replicas: 3

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      containers:
        - name: flask
          image: kubernetes-flask:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5006
