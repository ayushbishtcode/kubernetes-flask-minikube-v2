apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: flask-hpa
  namespace: flask-dev

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-deployment

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
